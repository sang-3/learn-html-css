<!doctype html>
<html lang="ko-KR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="/public/favicon/likelion.ico" type="image/x-icon" />
    <link rel="icon" href="/public/favicon/likelion.svg" type="image/svg" />
    <title>form(input) 요소</title>
  </head>
  <body>
    <a href="/index.html">Index로 이동</a>
    <h1>form(input) 요소</h1>
    <form method="post" action="https://formspree.io/f/xeqwwbwk">
      <fieldset>
        <legend>사용자 정보</legend>
        <div>
          <label for="userID">이름</label>
          <input placeholder="예시)홍길동" required id="userID" type="text" name="name" />
        </div>
        <div>
          <label for="userEmail">이메일</label>
          <input placeholder="예시)seulbinim@gmail.com" required id="userEmail" type="email" name="email" />
        </div>
        <div>
          <label for="userPwd">비밀번호</label>
          <input placeholder="8자리 이상, 대문자/소문자/숫자/특수문자로 구성 필요" required pattern="^(?=.*[A-Z])(?=.*[a-z])(?=.*\d)(?=.*[^A-Za-z0-9])\S{8,}$" title="8자 이상, 대문자/소문자/숫자/특수문자를 각각 1자 이상 포함하고 공백 없이 입력" id="userPwd" type="password" name="password" />
        </div>
        <button type="submit">전송</button>
      </fieldset>
    </form>
    <hr />
    <form method="post" action="https://formspree.io/f/xeqwwbwk">
      <div><label for="userId">이름</label> <input id="userId" type="text" /></div>
      <div><label for=""></label>비밀번호 <input type="password" /></div>
      <div><label for="search">검색어</label> <input id="search" name="keyword" type="search" /></div>
      <div><label for="userPhone">전화번호</label> <input id="userPhone" name="userPhone" type="tel" /></div>
      <div><label for="">이메일</label> <input type="email" /></div>
      <!-- checkbocx : 체크박스 서식 -->
      <div>
        <input type="checkbox" checked name="bootcamp" id="bootcampHtml" />
        <label for="bootcampHtml">HTML</label>
      </div>
      <div><input type="checkbox" name="bootcamp" id="bootcampCss" /> <label for="bootcampCss">CSS</label></div>
      <!-- radio : 라디오 서식 -->
      <!-- 암목적인 레이블링 : 스크린리더 환경에서의 이슈때문에 권장하지 않음 -->
      <div>
        <label><input type="radio" checked name="classRoom" value="classRoom1" />회고 1팀 </label>
      </div>
      <div>
        <label><input type="radio" name="classRoom" value="classRoom2" />회고 2팀</label>
      </div>
      <button type="submit">전송</button>
      <button type="reset">초기화</button>
      <button type="button">버튼</button>
    </form>
  </body>
</html>
